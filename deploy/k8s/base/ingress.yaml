apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nolcore
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  rules:
    - host: nolcore.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nolcore-api
                port:
                  name: http
