apiVersion: v1
kind: Service
metadata:
  name: nolcore-api
spec:
  selector:
    app.kubernetes.io/name: nolcore-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nolcore-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nolcore-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nolcore-api
    spec:
      containers:
        - name: api
          image: ghcr.io/noliae-france/nolcore:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: NOLIAE_BIND
              value: 0.0.0.0
            - name: NOLIAE_PORT
              value: "8080"
            - name: NOLIAE_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: nolcore-secrets
                  key: session-secret
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nolcore-secrets
                  key: postgres-password
            - name: NOLCORE_DATABASE_URL
              value: postgres://nolcore:$(POSTGRES_PASSWORD)@postgres:5432/nolcore
          envFrom:
            - secretRef:
                name: nolcore-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 8080
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 30
