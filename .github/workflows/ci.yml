name: NolCore CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nolcore:ci
          load: true
      - name: Smoke test HTTP server
        run: |
          set -e
          test "$(sha256sum schema.sql | cut -d' ' -f1)" = "$(sha256sum deploy/k8s/base/schema.sql | cut -d' ' -f1)"
          docker network create nolcore-ci
          docker run -d --rm --name nolcore-db --network nolcore-ci \
            -e POSTGRES_DB=nolcore -e POSTGRES_USER=nolcore -e POSTGRES_PASSWORD=ci_password \
            -v "$PWD/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro" postgres:16-alpine
          mkdir -p /tmp/nolcore-smtp-certs
          docker build -t nolcore-postfix:ci tests/postfix
          docker run -d --name nolcore-postfix --network nolcore-ci --network-alias smtp-test \
            -v /tmp/nolcore-smtp-certs:/certs nolcore-postfix:ci
          for i in $(seq 1 30); do test -f /tmp/nolcore-smtp-certs/ca.crt && break || sleep 1; done
          sleep 5
          test "$(docker inspect -f '{{.State.Running}}' nolcore-postfix)" = "true" || { docker logs nolcore-postfix || true; exit 1; }
          docker exec nolcore-postfix sh -c "printf 'QUIT\\r\\n' | openssl s_client -connect smtp-test:465 -servername smtp-test -CAfile /certs/ca.crt -quiet 2>/dev/null | head -1 | grep -E '^220'"
          for i in $(seq 1 30); do docker exec nolcore-db pg_isready -U nolcore -d nolcore && break || sleep 1; done
          docker exec nolcore-db psql -U nolcore -d nolcore -c "INSERT INTO smtp_profiles(id,host,port,username,secret_env) VALUES('ci-verify','smtp-test',465,'','CI_SMTP_PASSWORD')"
          docker run -d --rm --name nolcore-smoke --network nolcore-ci -p 8080:8080 \
            -e NOLIAE_SESSION_SECRET=ci-secret-0123456789-0123456789-0123 \
            -e NOLCORE_SMTP_CI_SMTP_465_FROM=nolcore@smtp-test \
            -e NOLCORE_SMTP_CI_SMTP_587_FROM=nolcore@smtp-test \
            -e NOLCORE_SMTP_CA_FILE=/certs/ca.crt \
            -e NOLCORE_VERIFICATION_SMTP_ID=ci-verify \
            -e NOLCORE_VERIFICATION_FROM=nolcore@smtp-test \
            -e NOLCORE_PUBLIC_URL=http://127.0.0.1:8080 \
            -v /tmp/nolcore-smtp-certs:/certs:ro \
            -e NOLCORE_DATABASE_URL=postgres://nolcore:ci_password@nolcore-db:5432/nolcore nolcore:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1 && break || sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/health | jq -e '.status == "ok"'
          curl -fsS -X POST http://127.0.0.1:8080/v1/user/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.test","name":"CI User","password":"ci-password-123"}' > /tmp/register.json
          for i in $(seq 1 20); do VERIFY_TOKEN=$(docker exec nolcore-postfix sh -c "grep -Rho 'token=[0-9a-f]*' /home/ci/Maildir/new /home/ci/Maildir/cur /var/mail/ci 2>/dev/null | head -1 | cut -d= -f2") && test -n "$VERIFY_TOKEN" && break || sleep 1; done
          test -n "$VERIFY_TOKEN" || { cat /tmp/register.json; docker exec nolcore-postfix find /home/ci/Maildir /var/mail -maxdepth 2 -type f -print; exit 1; }
          test -n "$VERIFY_TOKEN"
          curl -fsS "http://127.0.0.1:8080/v1/user/verify?token=$VERIFY_TOKEN" | jq -e '.verified == true'
          curl -fsS -X POST http://127.0.0.1:8080/v1/user/login \
            -H 'Content-Type: application/json' \
            -c /tmp/cookies.txt -d '{"email":"ci@example.test","password":"ci-password-123"}' > /tmp/login.json
          TOKEN=$(jq -r .token /tmp/login.json)
          test "$TOKEN" != "null" && test -n "$TOKEN"
          curl -fsS http://127.0.0.1:8080/v1/user/me -H "Authorization: Bearer $TOKEN" | jq -e '.email == "ci@example.test"'
          curl -fsS http://127.0.0.1:8080/v1/user/me -b /tmp/cookies.txt | jq -e '.email == "ci@example.test"'
          curl -fsS -X POST http://127.0.0.1:8080/v1/user/me/changepassword \
            -H 'Content-Type: application/json' -b /tmp/cookies.txt \
            -d '{"password":"ci-password-456"}' | jq -e '.updated == true'
          curl -fsS -X POST http://127.0.0.1:8080/v1/user/me/changemail \
            -H 'Content-Type: application/json' -b /tmp/cookies.txt \
            -d '{"email":"ci-renamed@example.test"}' | jq -e '.updated == true'
          test "$(curl -sS http://127.0.0.1:8080/v1/user/me -b /tmp/cookies.txt -o /tmp/revoked.out -w '%{http_code}')" = "401"
          curl -fsS -X POST http://127.0.0.1:8080/v1/user/login \
            -H 'Content-Type: application/json' -c /tmp/new-cookies.txt \
            -d '{"email":"ci-renamed@example.test","password":"ci-password-456"}' | jq -e '.token != null'
          docker exec nolcore-db psql -U nolcore -d nolcore -c "UPDATE users SET role='admin' WHERE email='ci-renamed@example.test'"
          curl -fsS http://127.0.0.1:8080/v1/admin/user/ -b /tmp/new-cookies.txt | jq -e 'type == "array"'
          curl -fsS -X POST http://127.0.0.1:8080/v1/admin/smtp/ \
            -H 'Content-Type: application/json' -b /tmp/new-cookies.txt \
            -d '{"id":"ci-smtp-465","host":"smtp-test","port":"465","username":"","secret_env":"CI_SMTP_PASSWORD"}' | jq -e '.configured == true'
          curl -fsS -X POST http://127.0.0.1:8080/v1/smtp/ci-smtp-465/send \
            -H 'Content-Type: application/json' -b /tmp/new-cookies.txt \
            -d '{"to":"ci@smtp-test","subject":"NolCore CI 465","body":"SMTPS 465 OK"}' | jq -e '.sent == true'
          curl -fsS http://127.0.0.1:8080/v1/smtp/ci-smtp-465/pool -b /tmp/new-cookies.txt | jq -e '.[0].status == "sent"'
          docker exec nolcore-postfix doveadm search -u ci mailbox INBOX SUBJECT 'NolCore CI 465'
          curl -fsS -X POST http://127.0.0.1:8080/v1/admin/smtp/ \
            -H 'Content-Type: application/json' -b /tmp/new-cookies.txt \
            -d '{"id":"ci-smtp-587","host":"smtp-test","port":"587","username":"","secret_env":"CI_SMTP_PASSWORD"}' | jq -e '.configured == true'
          curl -fsS -X POST http://127.0.0.1:8080/v1/smtp/ci-smtp-587/send \
            -H 'Content-Type: application/json' -b /tmp/new-cookies.txt \
            -d '{"to":"ci@smtp-test","subject":"NolCore CI 587","body":"STARTTLS 587 OK"}' | jq -e '.sent == true'
          docker exec nolcore-postfix doveadm search -u ci mailbox INBOX SUBJECT 'NolCore CI 587'
          curl -fsS -X POST http://127.0.0.1:8080/api/documents \
            -H 'Content-Type: application/json' -b /tmp/new-cookies.txt \
            -d '{"title":"CI hello","content":"hello NolCore search"}' | jq -e '.id != null'
          curl -fsS http://127.0.0.1:8080/v1/search/text/hello -b /tmp/new-cookies.txt | jq -e 'length >= 1'
          docker stop nolcore-smoke
          docker stop nolcore-postfix
          docker rm nolcore-postfix
          docker stop nolcore-db
          docker network rm nolcore-ci
